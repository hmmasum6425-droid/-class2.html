<!DOCTYPE html>
<html>
<head>
    <title>learning html style</title>
</head>
<body>
    <h1 style="text-align:center; color:red;">Bangladesh in red</h1>
    
    <h1 style="text-align:center; color:green;">Bangladesh in green</h1>
    
    <h1 style="text-align:center; color:blue;">Bangladesh in blue</h1>
    
    <h1 style="text-align:center; color:orange;">Bangladesh in orange</h1>
    
    <hr>        
    
    <h1 style="text-align:center; color:rgb(255,0,0);">Pure Red with RGB</h1>

    <h1 style="text-align:center; color:rgb(0,255,0);">Pure Green with RGB</h1>

    <h1 style="text-align:center; color:rgb(0,0,255);">Pure Blue with RGB</h1>

    <h1 style="text-align:center; color:purple;">Purple Color</h1>
</body>
</html>
